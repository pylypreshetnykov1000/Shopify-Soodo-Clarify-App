# Staging deployment. Review Render's displayed charges before creating services.
services:
  - type: web
    name: soodo-clarity
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "false"
      - key: SCOPES
        value: read_products,write_products,read_metaobjects,read_legal_policies,read_orders
      - key: DATABASE_URL
        fromDatabase:
          name: soodo-clarity-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
databases:
  - name: soodo-clarity-db
    databaseName: soodo_clarity
    user: soodo_clarity
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []
