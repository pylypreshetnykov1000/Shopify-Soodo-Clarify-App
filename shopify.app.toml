# This file stores configurations for your Shopify app.
client_id = "61dae5d937dbca44f2859e356686766c"
name = "Soodo GEO"
application_url = "https://shopify-soodo-clarify-app.onrender.com"
embedded = true

[auth]
redirect_urls = ["https://shopify-soodo-clarify-app.onrender.com/auth/callback", "https://shopify-soodo-clarify-app.onrender.com/auth/shopify/callback"]

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_products,read_metaobjects,read_legal_policies"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete"]
  uri = "/webhooks/products"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/privacy"

